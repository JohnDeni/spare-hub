name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sparehub_db
          POSTGRES_USER: sparehub_user
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: sparehub_db
      DB_USER: sparehub_user
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      DEBUG: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry==2.4.3

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run Ruff
        run: poetry run ruff check .

      - name: Check formatting
        run: poetry run black --check .

      - name: Apply migrations
        run: poetry run python manage.py migrate --noinput

      - name: Run tests
        run: poetry run python manage.py test
